<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="credits.css?v=17" />
    <link rel="stylesheet" href="minimal-theme.css?v=27" />
    <title>KONOMI 写真の掲載元</title>
  </head>
  <body>
    <header class="credits-hero">
      <a href="./" class="back-link">← KONOMIへ戻る</a>
      <p class="eyebrow">PHOTO PROVENANCE</p>
      <h1>写真の掲載元</h1>
      <p>診断と結果で使用する94ブランドの写真と、古着屋で掲載された写真の取得元です。</p>
    </header>
    <main>
      <section class="policy" aria-labelledby="policy-title">
        <h2 id="policy-title">掲載元について</h2>
        <p>各写真は商品ページまたは掲載ページへリンクしています。画像は掲載元のURLから表示するため、掲載終了やアクセス制限で見られなくなる場合があります。</p>
        <p>写真の再表示条件と商用利用の許諾は全件確認できていません。公開前に権利者の許諾を確認してください。</p>
      </section>
      <section aria-labelledby="credits-title">
        <div class="list-heading">
          <div><p class="eyebrow">SOURCE LIST</p><h2 id="credits-title">使用写真</h2></div>
          <p id="photoCount" aria-live="polite">読み込み中…</p>
        </div>
        <div id="creditsGrid" class="credits-grid"></div>
        <p id="creditsError" class="error" hidden>掲載元を読み込めませんでした。</p>
      </section>
    </main>
    <script src="credits.js?v=3"></script>
  </body>
</html>
