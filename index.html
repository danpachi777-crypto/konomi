<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="好きな服を左右にスワイプして、自分の好みと着こなしを見つけるアプリ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=8" />
    <title>KONOMI — 好きから、似合うへ。</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar">
        <button class="brand" type="button" data-route="home" aria-label="ホームへ移動">
          <span class="brand-mark">K</span>
          <span>KONOMI</span>
        </button>
        <button class="text-button" type="button" id="aboutButton">このサービスについて</button>
      </header>

      <main id="app"></main>

      <nav class="bottom-nav" id="bottomNav" aria-label="メインメニュー" hidden>
        <button type="button" data-route="swipe" aria-label="診断">
          <span aria-hidden="true">◒</span><small>診断</small>
        </button>
        <button type="button" data-route="discover" aria-label="おすすめコーデ">
          <span aria-hidden="true">✦</span><small>おすすめ</small>
        </button>
        <button type="button" data-route="saved" aria-label="好き">
          <span aria-hidden="true">♡</span><small>好き</small>
        </button>
        <button type="button" data-route="result" aria-label="結果">
          <span aria-hidden="true">◎</span><small>結果</small>
        </button>
      </nav>
    </div>

    <dialog id="aboutDialog" class="sheet-dialog">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="dialog-close" type="button" aria-label="閉じる">×</button>
      <p class="eyebrow">ABOUT KONOMI</p>
      <h2>このサービスについて</h2>
      <p>診断用の54枚と、診断後に提案する別の40枚は、診断軸に合わせて新規生成したオリジナル素材です。初期設定で選んだ性別と診断結果に合わせて表示するルックを切り替えます。</p>
      <p>診断後の商品提案は実在するアイテムです。購入前に公式ストアで最新の価格・在庫・サイズをご確認ください。</p>
      <div class="dialog-links">
        <a href="PHOTO_SOURCES.md" target="_blank">写真の管理記録</a>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js?v=8"></script>
    <script src="products.js?v=8"></script>
    <script src="shops.js?v=8"></script>
    <script src="recommendations.js?v=8"></script>
    <script src="logic.js?v=8"></script>
    <script src="app.js?v=8"></script>
  </body>
</html>
