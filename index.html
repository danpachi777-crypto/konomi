<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="好きな服を左右にスワイプして、自分の好みと着こなしを見つけるアプリ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>KONOMI — 好きから、似合うへ。</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar">
        <button class="brand" type="button" data-route="home" aria-label="ホームへ移動">
          <span class="brand-mark">K</span>
          <span>KONOMI</span>
        </button>
        <button class="text-button" type="button" id="aboutButton">素材について</button>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" id="bottomNav" aria-label="メインメニュー" hidden>
        <button type="button" data-route="swipe" aria-label="診断">
          <span aria-hidden="true">◒</span><small>診断</small>
        </button>
        <button type="button" data-route="saved" aria-label="好き">
          <span aria-hidden="true">♡</span><small>好き</small>
        </button>
        <button type="button" data-route="result" aria-label="結果">
          <span aria-hidden="true">◎</span><small>結果</small>
        </button>
      </nav>
    </div>

    <dialog id="aboutDialog" class="sheet-dialog">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="dialog-close" type="button" aria-label="閉じる">×</button>
      <p class="eyebrow">PHOTO POLICY</p>
      <h2>素材について</h2>
      <p>この試作版では、診断軸に合わせて新規生成したオリジナルのコーデ画像を表示しています。ブランドロゴや実在商品の画像は使用していません。</p>
      <p>実在商品の掲載時は、販売店の公式APIまたは承認済みアフィリエイト素材へ切り替えます。</p>
      <div class="dialog-links">
        <a href="PHOTO_SOURCES.md" target="_blank">写真の管理記録</a>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
